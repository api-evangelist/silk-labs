name: Silk Labs
description: >-
  Silk Labs was an on-device artificial intelligence startup founded in 2015 by
  former Mozilla CTO Andreas Gal together with Chris Jones and Michael Vines, a team
  drawn from Mozilla's Firefox OS effort. The company's open-source Silk platform
  layered a Node.js runtime on Android so developers could build Internet of Things
  applications entirely in JavaScript, and it later shipped work on the "Sense" AI
  home camera focused on running real-time visual and audio recognition directly on
  the device. Silk Labs was backed by investors including 500 Global and was acquired
  by Apple in November 2018, after which it ceased independent operations; the
  silklabs.com domain is now parked on Apple nameservers. Its open-source Silk code,
  GitHub organization, and npm packages remain publicly available and are captured in
  this profile.
